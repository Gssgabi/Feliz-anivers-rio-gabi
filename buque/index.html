<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Toma esse buquê que nunca te deram</title>
  <script src="assets/gsap.min.js"></script>
  <style>
    @font-face {
      font-family: Lavonia;
      src: url("assets/lavonia.woff2") format("woff2");
      font-display: swap;
    }
    html, body { margin: 0; background: #000; }
    #bouquet {
      position: relative;
      width: 1440px;
      height: 900px;
      overflow: hidden;
      container-type: size;
      background: #000;
    }
    #bouquet::before {
      content: "";
      position: absolute;
      inset: 0;
      background:
        linear-gradient(145deg, #41322be8, #342925e5 57%, #261e1be8),
        url("assets/jeans.webp") center / cover;
    }
    #bouquet::after {
      content: "";
      position: absolute;
      z-index: 2;
      inset: 0 0 auto;
      height: clamp(14px, 2.8cqh, 22px);
      background: url("assets/fita-costurada.png") center / 480px 480px repeat-x;
      pointer-events: none;
    }
    html.site, html.site body, html.site #bouquet { width: 100%; height: 100%; }
    .clip {
      --art-width: min(99cqw, 110cqh);
      --title-size: min(9.8cqw, 9cqh);
      --gap: clamp(24px, 6cqh, 64px);
      --art-height: calc(var(--art-width) * 2 / 3);
      --art-bottom: max(6cqh, calc((100cqh - var(--art-height) - var(--gap) - var(--title-size) * 2.28) / 2));
    }
    .bouquet-message {
      position: absolute;
      z-index: 1;
      inset: auto 5% calc(var(--art-bottom) + var(--art-height) + var(--gap));
      margin: 0;
      color: #fff;
      font: 400 var(--title-size) / 1.05 Lavonia, cursive;
    }
    .bouquet-line { position: relative; display: block; width: max-content; max-width: 100%; white-space: nowrap; }
    .bouquet-pin + .bouquet-line { margin-inline: 2% auto; }
    .bouquet-line-group { position: relative; display: block; width: max-content; margin: .18em 0 0 auto; }
    .bouquet-pin {
      position: absolute;
      top: -.67em;
      left: .02em;
      width: 1.45em;
      aspect-ratio: 639 / 799;
      background: url("assets/alfinete.png") center / contain no-repeat;
      rotate: 28deg;
    }
    .bouquet-flower {
      position: absolute;
      right: calc(100% + .2em);
      top: .02em;
      width: 1.08em;
      aspect-ratio: 783 / 611;
      background: url("assets/flor.webp") center / contain no-repeat;
    }
    .bouquet-art {
      position: absolute;
      display: block;
      right: 0;
      bottom: var(--art-bottom);
      width: var(--art-width);
      height: auto;
    }
    .bouquet-ornament {
      position: absolute;
      display: block;
      width: min(12cqw, 10cqh, 84px);
      z-index: 1;
      background-position: center;
      background-size: contain;
      background-repeat: no-repeat;
    }
    .bouquet-heart {
      right: 10%;
      bottom: calc(var(--art-bottom) + var(--art-height) * .73);
      aspect-ratio: 240 / 230;
      background-image: url("assets/coracao-da-moldura.webp");
    }
    .bouquet-rose {
      right: calc(var(--art-width) * .83);
      bottom: calc(var(--art-bottom) + var(--art-height) * .09);
      aspect-ratio: 288 / 282;
      background-image: url("assets/rosa-da-carta.webp");
    }
    html.site:not(.timeline-ready) #bouquet { visibility: hidden; }
    @container (7 / 5 <= aspect-ratio) {
      .clip {
        --art-width: min(53cqw, 111cqh);
        --title-size: min(5.65cqw, 9.3cqh);
        --art-bottom: 13cqh;
      }
      .bouquet-message {
        inset: 37% calc(var(--art-width) + 2cqw) auto auto;
        width: min(42cqw, 65cqh);
      }
    }
    @container (4 / 5 <= aspect-ratio < 7 / 5) {
      .clip { --art-width: min(88cqw, 94cqh); --title-size: min(7.6cqw, 8cqh); }
      .bouquet-message { inset-inline: 13%; }
    }
  </style>
  <script>
    if (new URLSearchParams(location.search).get('site') === '1') {
      document.documentElement.classList.add('site');
    }
  </script>
</head>
<body>
  <main id="bouquet" data-composition-id="bouquet" data-width="1440" data-height="900" data-duration="6">
    <h1 id="bouquet-title" class="clip bouquet-message" data-start="0" data-duration="6" data-track-index="1">
      <span class="bouquet-pin" aria-hidden="true"></span>
      <span class="bouquet-line">Toma esse buquê</span>
      <span class="bouquet-line-group">
        <span class="bouquet-flower" aria-hidden="true"></span>
        <span class="bouquet-line">que nunca te deram</span>
      </span>
    </h1>
    <img id="bouquet-artwork" class="clip bouquet-art" data-start="0" data-duration="6" data-track-index="2" data-layout-allow-overflow src="assets/rosas.webp" alt="Uma mão oferece um buquê de rosas vermelhas embrulhado em papel antigo.">
    <div id="bouquet-ornaments" class="clip" data-start="0" data-duration="6" data-track-index="3" aria-hidden="true">
      <span id="bouquet-heart" class="bouquet-ornament bouquet-heart"></span>
      <span id="bouquet-rose" class="bouquet-ornament bouquet-rose"></span>
    </div>
  </main>
  <script>
    const [firstLine, secondLine] = document.querySelectorAll('.bouquet-line');
    const pin = document.querySelector('.bouquet-pin');
    const flower = document.querySelector('.bouquet-flower');
    const artwork = document.querySelector('.bouquet-art');
    const heart = document.querySelector('.bouquet-heart');
    const rose = document.querySelector('.bouquet-rose');
    const hiddenInk = 'inset(-50% 105% -45% -10%)';
    const visibleInk = 'inset(-50% -10% -45% -10%)';

    const timeline = gsap.timeline({ paused: true });
    timeline
      .fromTo(pin, { scale: 0 }, { scale: 1, duration: .42, ease: 'back.out(1.3)' }, .06)
      .fromTo(firstLine, { clipPath: hiddenInk }, { clipPath: visibleInk, duration: .88, ease: 'steps(15)' }, .12)
      .fromTo(flower, { scale: 0, rotation: -42 }, { scale: 1, rotation: -22, duration: .66, ease: 'back.out(1.5)' }, .62)
      .fromTo(secondLine, { clipPath: hiddenInk }, { clipPath: visibleInk, duration: .96, ease: 'steps(18)' }, .67)
      .fromTo(artwork,
        { xPercent: 101, yPercent: 5, scale: .87, transformOrigin: 'right center' },
        { xPercent: 9, yPercent: 1, scale: .96, duration: 1.2, ease: 'power2.out' },
        1.18)
      .to(artwork, { xPercent: 0, yPercent: 0, scale: 1, duration: .65, ease: 'power2.inOut' }, 2.38)
      .fromTo(heart, { scale: 0, y: 12, rotation: -11 }, { scale: 1, y: 0, rotation: 12, duration: .59, ease: 'back.out(1.2)' }, 1.98)
      .fromTo(rose, { scale: 0, y: 10, rotation: -24 }, { scale: 1, y: 0, rotation: -8, duration: .55, ease: 'back.out(1.2)' }, 2.54);

    window.__timelines = window.__timelines || {};
    window.__timelines.bouquet = timeline;

    if (document.documentElement.classList.contains('site')) {
      document.documentElement.classList.add('timeline-ready');
      window.addEventListener('message', event => {
        if (event.source !== window.parent || event.data?.type !== 'bouquet-visibility') return;
        if (!event.data.animate) timeline.progress(1).pause();
        else if (event.data.outside) timeline.pause(0);
        else if (event.data.active) timeline.play();
        else timeline.pause();
      });
    }
  </script>
</body>
</html>
